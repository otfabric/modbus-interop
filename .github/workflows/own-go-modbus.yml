name: Own stack (go-modbus)
run-name: "Own stack go-modbus (${{ github.event_name }}) on ${{ github.ref_name }}"

# Publishes ghcr.io/otfabric/modbus-interop-otfabric: OT Fabric's own stack behind the
# container contract, so that others can test against it (own/go-modbus/README.md).
#
# It stands apart from everything else in this repository on purpose, and so
# that no release loop can form:
# - It builds a released go-modbus tag, never main, and go-modbus depends on
#   nothing here: no release or required check of go-modbus needs this image.
# - The Release workflow, manifest.json and the Makefile's ADAPTERS do not
#   contain it, so a broken go-modbus cannot hold up a release of the harness.
# - A failure here blocks only this image.
#
# Daily, it reports a go-modbus release newer than the pin in an issue. A bump is
# a reviewed change; merging it publishes. Run it by hand to publish at once.
on:
  push:
    branches: [main]
    paths:
      - "own/go-modbus/**"
      - ".github/workflows/own-go-modbus.yml"
  pull_request:
    paths:
      - "own/go-modbus/**"
      - ".github/workflows/own-go-modbus.yml"
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-go-modbus-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/otfabric/modbus-interop-otfabric
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  drift:
    name: Pin against the latest go-modbus
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Report a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(sed -nE 's/^ARG UPSTREAM_VERSION=(.+)$/\1/p' own/go-modbus/Dockerfile | head -1)
          latest=$(git ls-remote --tags --refs https://github.com/otfabric/go-modbus.git 'v[0-9]*' \
            | sed 's,.*refs/tags/,,' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "pin ${pin}, latest ${latest}" | tee -a "$GITHUB_STEP_SUMMARY"
          title="modbus-interop-otfabric: go-modbus release behind the pin"
          open=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ "${pin}" = "${latest}" ]; then
            [ -z "${open}" ] || gh issue close "${open}" --comment "The pin is ${pin}, the latest release."
            exit 0
          fi
          body="go-modbus ${latest} is out and the image is on ${pin}. Move the pin as own/go-modbus/README.md describes; merging publishes the image."
          if [ -n "${open}" ]; then gh issue edit "${open}" --body "${body}"; else gh issue create --title "${title}" --body "${body}"; fi

  version:
    name: Resolve version
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      tag: ${{ steps.version.outputs.tag }}
      harness: ${{ steps.version.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: The pin, the image tag and the harness release to test against
        env:
          SHA: ${{ github.sha }}
        run: |
          upstream=$(sed -nE 's/^ARG UPSTREAM_VERSION=(.+)$/\1/p' own/go-modbus/Dockerfile | head -1)
          revision=$(sed -nE 's/^ARG UPSTREAM_SHA=(.+)$/\1/p' own/go-modbus/Dockerfile | head -1)
          for want in "${upstream}" "${revision}"; do
            sed -n '/^own_implementations:/,/^[a-z]/p' versions.yaml | grep -qF "${want}" \
              || { echo "::error::${want} is not under own_implementations in versions.yaml"; exit 1; }
          done
          grep -qF "github.com/otfabric/go-modbus ${upstream}" own/go-modbus/go.mod \
            || { echo "::error::own/go-modbus/go.mod is not on ${upstream}"; exit 1; }
          git ls-remote --tags https://github.com/otfabric/go-modbus.git "refs/tags/${upstream}^{}" | grep -q "^${revision}" \
            || { echo "::error::go-modbus ${upstream} is not commit ${revision}"; exit 1; }
          harness=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          {
            echo "upstream=${upstream}"
            echo "tag=${upstream}-${SHA:0:7}"
            echo "harness=${harness}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build, test (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.harness }}
      TAG: ${{ needs.version.outputs.tag }}
      ADAPTER_IMAGE_otfabric: ghcr.io/otfabric/modbus-interop-otfabric:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Build
        run: |
          scripts/retry.sh docker build --build-arg BASE_REGISTRY="${BASE_REGISTRY}" --build-arg ADAPTER_VERSION="${TAG}" \
            --tag "${ADAPTER_IMAGE_otfabric}" --file own/go-modbus/Dockerfile .

      - name: Pull the released reference images
        run: |
          for a in libmodbus pymodbus digitalpetri nmodbus tokiomodbus; do
            scripts/retry.sh docker pull --quiet "ghcr.io/otfabric/modbus-interop-${a}:${VERSION}"
          done

      - name: Smoke, cross-stack self-test against the references, document schemas
        run: |
          mkdir -p reports
          REPORT_DIR=reports scripts/smoke.sh otfabric
          REPORT_DIR=reports scripts/interop.sh otfabric libmodbus pymodbus digitalpetri nmodbus tokiomodbus
          python3 scripts/validate-documents.py reports

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-go-modbus-documents-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore

      - name: Push the tested image as <tag>-<arch>
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          docker tag "${ADAPTER_IMAGE_otfabric}" "${IMAGE}:${TAG}-${ARCH}"
          scripts/retry.sh docker push --quiet "${IMAGE}:${TAG}-${ARCH}"

  publish:
    name: Multi-arch image and release
    needs: [version, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      UPSTREAM: ${{ needs.version.outputs.upstream }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Join the architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          # <tag> never moves. <upstream> is the newest build of that go-modbus release.
          scripts/retry.sh docker buildx imagetools create --tag "${IMAGE}:${TAG}" --tag "${IMAGE}:${UPSTREAM}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
      - name: GitHub release, never the latest one of this repository
        env:
          SHA: ${{ github.sha }}
        run: |
          digest=$(scripts/retry.sh docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')
          cat > notes.md <<NOTES
          go-modbus ${UPSTREAM} behind the container contract, for testing.

          \`${IMAGE}@${digest}\`

          This is OT Fabric's own stack, not an independent implementation: a result against it is not independent evidence for go-modbus.
          NOTES
          gh release create "modbus-interop-otfabric/${TAG}" --target "${SHA}" --latest=false \
            --title "modbus-interop-otfabric ${TAG}" --notes-file notes.md
          echo "${IMAGE}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
