# Machine-readable version manifest for modbus-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.4.1"
contract_version: "1.2"        # docs/CONTAINER_CONTRACT.md, schemaVersion of every document
fixture_schema: "1.1"          # fixtures/schema/modbus-fixture.schema.json

protocol:
  name: "Modbus TCP"
  default_port: 1502           # inside the images; the registered port 502 needs root

implementations:
  libmodbus:
    priority: P0
    upstream: "libmodbus"
    repository: "https://github.com/stephane/libmodbus"
    version: "v3.2.0"
    revision: "a9b025d12289855490b10d77461c99e001abfc0f"
    license: "LGPL-2.1-or-later"
    bundled:
      cjson: "1.7.18-3.1+deb13u1"   # Debian libcjson1, MIT; ARG CJSON_VERSION
    language: "C"
    independent_engine: true
    roles: [server, client]

  pymodbus:
    priority: P0
    upstream: "PyModbus"
    repository: "https://github.com/pymodbus-dev/pymodbus"
    artifact: "pypi:pymodbus"
    version: "3.16.1"
    revision: "804ae510d400e7690d86c8a1f648fa3f6c940330"   # tag v3.16.1; information, the build installs the wheel
    wheel_sha256: "bb433f7417280bdea1190d95495aa6fb8e1fa8e0d720c436922b270bc378024c"
    license: "BSD-3-Clause"
    language: "Python"
    independent_engine: true
    roles: [server, client]

  digitalpetri:
    priority: P0
    upstream: "digitalpetri/modbus"
    repository: "https://github.com/digitalpetri/modbus"
    artifact: "com.digitalpetri.modbus:modbus-tcp"
    version: "2.1.6"
    revision: "0599935194c38c54c540293de2501ad3fe47da50"   # tag v2.1.6; information, the build fetches Maven artifacts
    minimum: "2.1.6"             # the raw request hooks the adapter uses are new in this release
    license: "EPL-2.0"
    language: "Java"
    independent_engine: true
    roles: [server, client]

  nmodbus:
    priority: P1
    upstream: "NModbus"
    repository: "https://github.com/NModbus/NModbus"
    artifact: "nuget:NModbus"
    version: "3.0.83"
    revision: "d96e7707a08cebe7f436087e7d575c930963d91a"
    license: "MIT"
    language: "C#"
    independent_engine: true
    roles: [server, client]

  tokiomodbus:
    priority: P1
    upstream: "tokio-modbus"
    repository: "https://github.com/slowtec/tokio-modbus"
    artifact: "crates.io:tokio-modbus"
    version: "0.17.0"
    revision: "dd151a6a10a9e74bb7c982578aed21413562dc5a"   # from the crate's .cargo_vcs_info.json; information
    crate_sha256: "95d06136e737e962c71d922a09148f5a264f6609a021fdf031ad16ffd172c818"
    license: "MIT OR Apache-2.0"
    language: "Rust"
    independent_engine: true
    roles: [server, client]

  j2mod:
    priority: P1
    upstream: "j2mod"
    repository: "https://github.com/steveohara/j2mod"
    artifact: "com.ghgande:j2mod"
    version: "3.4.0"
    revision: "d7861c90f40a7ac219a2dc6987ffa54caa5d47a7"   # tag v3.4.0; information, the build fetches Maven artifacts
    jar_sha256: "0d4254d260c81bc4b5e1e5be1f77ebc5156f42437d5e8c88907af41f7f11ed9a"
    license: "Apache-2.0"
    language: "Java"
    independent_engine: true
    roles: [server, client]

  jsmodbus:
    priority: P1
    upstream: "jsmodbus"
    repository: "https://github.com/Cloud-Automation/node-modbus"
    artifact: "npm:jsmodbus"
    version: "5.0.0"
    revision: "fdf02b2600b22519ae4e7465e9bec381a1653172"   # npm gitHead, branch v5.0-dev, no tag; information, the build installs the tarball
    tarball_integrity: "sha512-YuJlEoWn06eeV4xgMNw8v+07QEaJcq3x7ROtapk3z1QWmbZJn94JkV2yrxULeWIYSrgbLDivifUL2QFq7m/low=="
    bundled: { commander: "11.1.0", crc: "4.3.2", debug: "4.4.3", ms: "2.1.3" }   # npm, MIT, package-lock.json
    license: "MIT"
    language: "JavaScript"
    independent_engine: true
    roles: [server, client]

  modbus4j:
    priority: P1
    upstream: "modbus4j"
    repository: "https://github.com/MangoAutomation/modbus4j"
    artifact: "github archive refs/tags/v3.1.0.tar.gz, built from source (not on Maven Central)"
    version: "3.1.0"
    revision: "3325a2cbce786989156ba7999d6adc2755f7ea5b"   # tag v3.1.0
    source_sha256: "eb20d1fce2d25e3de8e1b67025ca06cf43babd9a249dad82c4a49ebf2fd93344"
    license: "GPL-3.0-or-later"
    adapter_license: "GPL-3.0-or-later"   # adapters/modbus4j links it
    language: "Java"
    independent_engine: true
    roles: [server, client]
    published: false                      # GPL: built locally from the pinned source, never pushed

  modbusesp:
    priority: P1
    upstream: "modbus-esp8266"
    repository: "https://github.com/emelianov/modbus-esp8266"
    version: "4.1.1"
    revision: "299666307a052df52f757f3131e292c2513bb57f"   # tag 4.1.1; library.properties says 4.1.0
    license: "BSD-3-Clause"
    bundled:
      cjson: "1.7.18-3.1+deb13u1"   # Debian libcjson1, MIT; ARG CJSON_VERSION
      gxx: "14.2.0-19"              # Debian g++-14, build only; ARG GXX_VERSION
    language: "C++"
    independent_engine: true
    roles: [server, client]

# OT Fabric's own stacks. Not independent implementations, not in a release of
# this repository or its manifest.json: see own/<library>/README.md.
own_implementations:
  otfabric:
    upstream: "go-modbus"
    repository: "https://github.com/otfabric/go-modbus"
    artifact: "go:github.com/otfabric/go-modbus"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    image: "ghcr.io/otfabric/modbus-interop-otfabric"
    build: "own/go-modbus"

